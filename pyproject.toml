[project]
name = "auth-service"
version = "0.1.0"
description = "An authentication and authorisation service for other UKAEA services."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "pyjwt[crypto]>=2.10.1",
    "requests>=2.32.5",
]


[dependency-groups]
dev = [
    "black>=25,<26",
    "flake8>=7,<8",
    "isort>=6,<7",
    "pre-commit>=4,<5",
]
